name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Rules engine replays
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test --package-path PerihelionKit

  app:
    name: iPhone app builds
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build for the simulator
        run: >
          xcodebuild -project Perihelion.xcodeproj -scheme Perihelion
          -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/xcode
          CODE_SIGNING_ALLOWED=NO build
